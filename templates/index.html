<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mairie de L'Isle-Adam — Sensibilisation Cybersécurité</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            max-width: 600px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 35px 30px;
        }
        .header-title {
            color: #1e3a8a;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .desc-box {
            background: #f8fafc;
            border-left: 4px solid #2563eb;
            padding: 12px 16px;
            font-size: 14px;
            color: #334155;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1e293b;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .btn-submit {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-title">Entraînement : Détection des e-mails frauduleux</div>
        <div class="subtitle">Mairie de L'Isle-Adam — Direction des Systèmes d'Information</div>

        <div class="desc-box">
            Testez vos réflexes face à des situations concrètes du quotidien municipal. Pour chaque e-mail présenté, analysez attentivement les détails et déterminez s'il est légitime ou suspect.
        </div>

        <form method="POST">
            <div class="form-group">
                <label for="nom">Nom ou Prénom :</label>
                <input type="text" id="nom" name="nom" required placeholder="Ex : Marie Dupont">
            </div>

            <div class="form-group">
                <label for="service">Service / Direction :</label>
                <input type="text" id="service" name="service" required placeholder="Ex : État Civil, Finances, Technique...">
            </div>

            <button type="submit" class="btn-submit">Commencer l'exercice</button>
        </form>
    </div>

</body>
</html>
