<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mairie de L'Isle-Adam — Sensibilisation Cybersécurité</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            max-width: 600px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 35px 30px;
        }
        .header-title {
            color: #1e3a8a;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .desc-box {
            background: #f8fafc;
            border-left: 4px solid #2563eb;
            padding: 12px 16px;
            font-size: 14px;
            color: #334155;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1e293b;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background-color: #ffffff;
            color: #1e293b;
        }
        select {
            cursor: pointer;
        }
        input[type="text"]:focus, select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .btn-submit {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-title">Entraînement : Détection des e-mails frauduleux</div>
        <div class="subtitle">Mairie de L'Isle-Adam — Direction des Systèmes d'Information</div>

        <div class="desc-box">
            Testez vos réflexes face à des situations concrètes du quotidien municipal. Pour chaque e-mail présenté, analysez attentivement les détails et déterminez s'il est légitime ou suspect.
        </div>

        <form method="POST">
            <div class="form-group">
                <label for="nom">Nom et prénom :</label>
                <input type="text" id="nom" name="nom" required placeholder="Ex : Marie Dupont">
            </div>

            <div class="form-group">
                <label for="service">Service / Direction :</label>
                <select id="service" name="service" required>
                    <option value="" disabled selected>-- Sélectionnez votre service --</option>
                    <option value="Accueil Castelrose">Accueil Castelrose</option>
                    <option value="Accueil hôtel de ville">Accueil hôtel de ville</option>
                    <option value="Adjoints & conseillers délégués">Adjoints & conseillers délégués</option>
                    <option value="Bibliothèque">Bibliothèque</option>
                    <option value="Cabinet du maire">Cabinet du maire</option>
                    <option value="CCAS">CCAS</option>
                    <option value="Communication - fêtes - associations">Communication - fêtes - associations</option>
                    <option value="CTM">CTM</option>
                    <option value="Direction générale des services">Direction générale des services</option>
                    <option value="Direction service technique">Direction service technique</option>
                    <option value="Enfance - Petite enfance - Affaires scolaires">Enfance - Petite enfance - Affaires scolaires</option>
                    <option value="Espace culturel">Espace culturel</option>
                    <option value="Espaces verts">Espaces verts</option>
                    <option value="Marchés publics & assurances">Marchés publics & assurances</option>
                    <option value="Multi-accueils & jeunesse">Multi-accueils & jeunesse</option>
                    <option value="Musée">Musée</option>
                    <option value="Police municipale">Police municipale</option>
                    <option value="Population - Etat civil - Elections">Population - Etat civil - Elections</option>
                    <option value="Service des sports">Service des sports</option>
                    <option value="Service Financier">Service Financier</option>
                    <option value="Service informatique">Service informatique</option>
                    <option value="Service RH">Service RH</option>
                    <option value="Service voirie">Service voirie</option>
                    <option value="Urbanisme">Urbanisme</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Commencer l'exercice</button>
        </form>
    </div>

</body>
</html>
